# Run `pre-commit install` after cloning to enable the hooks below.
#
# golangci-lint runs against changed Go files only on commit; the full
# repo gate still runs in CI. Update the `rev` here in lockstep with
# `version:` in .github/workflows/ci.yml so local + CI agree.
repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
