name: Feature request
description: Suggest a new feature or improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Help us understand the use case.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing problem or limitation. The "why" matters more than the "how".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like turborg to do?
      description: Describe the proposed feature. Code samples or pseudo-code welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
