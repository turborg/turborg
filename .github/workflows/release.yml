name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # release-please opens / updates a release PR as conventional commits
  # land on main. When that PR merges, it tags the release and creates a
  # GitHub Release; the goreleaser job below runs in response.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # The RELEASE_PLEASE_TOKEN PAT (not GITHUB_TOKEN) is required so
          # the release PR is authored by a user, which triggers CI on it.
          # PRs created by GITHUB_TOKEN do NOT trigger other workflows
          # (GitHub security guardrail), so without a PAT the release PR
          # never runs the CI gate and branch protection blocks the merge.
          # Provisioned by Pulumi in the turborg-manage stack.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser inspects git history for the changelog.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
