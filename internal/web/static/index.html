<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>turborg</title>
<!-- SVG favicon — `prefers-color-scheme` flips the brand color so the
     glyph stays legible against both dark and light browser chrome. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><style>.t{fill:%230a66cc}.l{fill:%230a66cc}@media(prefers-color-scheme:dark){.t{fill:%235cb6ff}.l{fill:%235cb6ff}}</style><rect class='t' x='4' y='12' width='36' height='10' rx='2'/><rect class='t' x='17' y='12' width='10' height='40' rx='2'/><rect class='l' x='44' y='18' width='16' height='5' rx='2.5' opacity='.95'/><rect class='l' x='48' y='29' width='12' height='5' rx='2.5' opacity='.75'/><rect class='l' x='46' y='40' width='14' height='5' rx='2.5' opacity='.55'/></svg>" />
<link rel="alternate icon" type="image/png" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%235cb6ff' x='4' y='12' width='36' height='10' rx='2'/><rect fill='%235cb6ff' x='17' y='12' width='10' height='40' rx='2'/></svg>" />
<style>
  :root {
    --bg: #14161a;
    --bg-pane: #1c1f24;
    --bg-input: #262a31;
    --bg-elev: #2c313a;
    --bg-hover: rgba(255,255,255,0.04);
    --border: #2a2e36;
    --fg: #dde2e8;
    --fg-dim: #8a929a;
    --accent: #5cb6ff;
    --accent-soft: rgba(92, 182, 255, 0.14);
    --warn: #ffb86c;
    --error: #ff7e7e;
    --ok: #7ee27e;
    --mention: #ff7e7e;
    --shadow-pane: 0 1px 0 rgba(255,255,255,0.02) inset, 0 4px 24px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9;
    --bg-pane: #ffffff;
    --bg-input: #f0f1f4;
    --bg-elev: #ffffff;
    --bg-hover: rgba(20,30,50,0.04);
    --border: #dde0e5;
    --fg: #18191c;
    --fg-dim: #5a6068;
    --accent: #0a66cc;
    --accent-soft: rgba(10, 102, 204, 0.10);
    --warn: #b66400;
    --error: #c83030;
    --ok: #2e9b3b;
    --mention: #c83030;
    --shadow-pane: 0 1px 2px rgba(20,30,50,0.04), 0 2px 8px rgba(20,30,50,0.04);
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    user-select: none; }
  #messages, .msg, input, .topic-text { user-select: text; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;
    border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); border: 2px solid transparent;
    background-clip: padding-box; }

  /* Login */
  #login { display: flex; align-items: center; justify-content: center; height: 100%;
    background: radial-gradient(at 50% 30%, var(--accent-soft), transparent 60%); }
  #login form { display: flex; flex-direction: column; gap: 12px; min-width: 320px;
    padding: 32px; background: var(--bg-pane); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-pane); }
  #login h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--ok)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  #login .subtitle { color: var(--fg-dim); font-size: 12px; margin: 0 0 8px; }
  /* Brand mark — uses currentColor so it inherits via .brand's color and
     adapts to light/dark theme automatically. */
  .brand { display: flex; align-items: center; gap: 12px; color: var(--accent);
    margin: 0 0 4px; }
  .brand-mark { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 0 12px var(--accent-soft)); }
  .brand-mark.mini { width: 22px; height: 22px; filter: none; opacity: 0.95; }
  #userbar .brand-mark.mini { color: var(--accent); }
  #login label { color: var(--fg-dim); font-size: 12px; }
  #login-error { color: var(--error); font-size: 12px; min-height: 18px; padding: 2px 0; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-input); color: var(--fg);
    transition: border-color 0.15s, box-shadow 0.15s; }
  input:focus, button:focus-visible { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent;
    font-weight: 600; }
  button:hover { filter: brightness(1.08); }
  button:disabled { cursor: wait; opacity: 0.7; }
  button.icon { background: transparent; color: var(--fg); border: 0; padding: 4px 8px;
    font-size: 16px; border-radius: 6px; }
  button.icon:hover { background: var(--bg-hover); }

  /* App layout. Default desktop columns are CSS so @media can override; JS
     sets explicit widths inline only on desktop (drag-resize). */
  #app { display: none; height: 100%; grid-template-areas:
    "userbar userbar userbar userbar userbar"
    "channels rs1 chat rs2 members";
    grid-template-columns: 220px 4px 1fr 4px 220px;
    grid-template-rows: 44px 1fr; }
  #app.active { display: grid; }
  #userbar { grid-area: userbar; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--bg-pane); border-bottom: 1px solid var(--border); }
  #status-dot { font-size: 9px; transition: color 0.2s; }
  #status-dot.ok { color: var(--ok); }
  #status-dot.warn { color: var(--warn); }
  #status-dot.error { color: var(--error); }
  #current-nick { font-weight: 700; letter-spacing: -0.2px; cursor: pointer;
    padding: 2px 6px; border-radius: 4px; transition: background 0.12s; }
  #current-nick:hover, #current-nick:focus-visible { background: var(--bg-hover); outline: none; }
  #userbar-spacer { flex: 1; }
  #userbar .status-text { color: var(--fg-dim); font-size: 11px; }

  /* Resizers */
  .resizer { width: 4px; cursor: col-resize; background: transparent;
    border-left: 1px solid var(--border); transition: background 0.15s; }
  .resizer:hover, .resizer.active { background: var(--accent-soft); }
  #resizer-left { grid-area: rs1; }
  #resizer-right { grid-area: rs2; }

  #channels, #members { background: var(--bg-pane); overflow-y: auto; padding: 8px 0; }
  #channels { grid-area: channels; }
  #members { grid-area: members; }
  .pane-title { color: var(--fg-dim); padding: 8px 16px 4px; text-transform: uppercase;
    font-size: 10px; letter-spacing: 1.2px; font-weight: 700; }
  .pane-title.with-action { display: flex; align-items: center; justify-content: space-between; }
  .pane-title button.icon { font-size: 14px; padding: 0 4px; }
  .channel { padding: 8px 12px 8px 14px; cursor: pointer; display: flex; align-items: center;
    gap: 8px; border-left: 3px solid transparent; transition: background 0.12s, border-color 0.12s;
    margin: 1px 6px; border-radius: 6px; }
  .channel:hover { background: var(--bg-hover); }
  .channel.active { background: var(--accent-soft); border-left-color: var(--accent);
    color: var(--accent); }
  .channel.server { color: var(--warn); }
  /* Backlog-only tab: bot isn't currently in the channel, so this row is
     just persisted history. Render dimmed so the user knows the difference
     between "live" and "browsing the archive". */
  .channel.parted { color: var(--fg-dim); font-style: italic; }
  .channel.parted .icon { opacity: 0.4; }
  .channel.parted.active { background: rgba(138,146,154,0.10);
    border-left-color: var(--fg-dim); color: var(--fg-dim); }
  /* Kicked / banned tab: stronger error styling so the operator sees at a
     glance that this isn't just a closed channel — they're locked out. */
  .channel.kicked { color: var(--error); font-style: italic;
    text-decoration: line-through; text-decoration-thickness: 1px;
    text-decoration-color: rgba(220,80,80,0.45); }
  .channel.kicked .icon { opacity: 0.9; }
  .channel.kicked.active { background: rgba(220,80,80,0.10);
    border-left-color: var(--error); color: var(--error); }
  .channel.server.active { background: rgba(255,184,108,0.10); border-left-color: var(--warn);
    color: var(--warn); }
  .channel .icon { width: 18px; flex: none; opacity: 0.85; font-size: 13px; text-align: center; }
  .channel .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500; }
  .channel.active .name { font-weight: 600; }
  .channel .badge { background: var(--accent); color: #fff; font-size: 10px;
    padding: 2px 7px; border-radius: 9px; min-width: 20px; text-align: center;
    font-weight: 700; line-height: 1.4; }
  .channel .badge.mention { background: var(--mention); }
  .channel .close { margin-left: auto; opacity: 0.4; visibility: hidden; padding: 0 4px;
    font-size: 16px; line-height: 1; }
  .channel:hover .close { visibility: visible; }
  .channel:hover .close:hover { opacity: 1; }
  .member { padding: 4px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    border-radius: 4px; margin: 0 6px; transition: background 0.12s; }
  .member:hover { background: var(--bg-hover); }
  .member .mode { display: inline-block; width: 10px; text-align: center;
    color: var(--accent); font-weight: 700; }
  .member.op .mode { color: var(--warn); }
  .member.halfop .mode { color: var(--ok); }
  .member.voice .mode { color: var(--accent); }

  /* Chat pane */
  #chat { grid-area: chat; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #topic { padding: 9px 18px; border-bottom: 1px solid var(--border); color: var(--fg-dim);
    font-size: 12px; min-height: 36px; display: flex; align-items: center; gap: 8px; }
  #topic .topic-icon { color: var(--accent); }
  #topic .topic-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #messages { flex: 1; overflow-y: auto; padding: 10px 18px 14px; scroll-behavior: smooth; }
  .msg { padding: 1px 0; word-wrap: break-word; animation: msgIn 0.18s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: none; } }
  .msg .ts { color: var(--fg-dim); margin-right: 10px; font-size: 11px;
    font-variant-numeric: tabular-nums; }
  .msg .nick { font-weight: 600; margin-right: 8px; }
  .msg.system { color: var(--fg-dim); font-style: italic; }
  .msg.system .nick { font-style: normal; }
  .msg.mention { background: rgba(255,126,126,0.10); border-left: 2px solid var(--mention);
    margin-left: -18px; padding-left: 16px; padding-right: 18px; }
  .msg.help { white-space: pre-wrap; }
  .msg.server { color: var(--fg-dim); }
  .msg.server.welcome { color: var(--accent); }
  .msg.server.error { color: var(--error); }
  .msg a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted; }
  .msg a:hover { border-bottom-style: solid; }
  .day-sep { color: var(--fg-dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; padding: 14px 0 6px; display: flex; align-items: center; gap: 12px; }
  .day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px;
    background: var(--border); }
  .new-sep { color: var(--mention); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 0 6px;
    display: flex; align-items: center; gap: 12px; }
  .new-sep::before, .new-sep::after { content: ""; flex: 1; height: 1px;
    background: var(--mention); opacity: 0.4; }
  .msg .quote-btn { opacity: 0; margin-left: 6px; cursor: pointer; color: var(--fg-dim);
    font-size: 11px; transition: opacity 0.12s; }
  .msg:hover .quote-btn { opacity: 0.8; }
  .msg .quote-btn:hover { opacity: 1; color: var(--accent); }

  /* Compose + autocomplete */
  #compose { display: flex; padding: 10px; border-top: 1px solid var(--border); gap: 8px;
    position: relative; }
  #compose textarea { flex: 1; padding: 10px 13px; border-radius: 6px; resize: none;
    font: inherit; min-height: 38px; max-height: 120px; line-height: 1.4; }
  #compose textarea:disabled { opacity: 0.5; cursor: not-allowed; }
  #autocomplete { position: absolute; bottom: calc(100% - 1px); left: 10px; right: 10px;
    max-height: 240px; overflow-y: auto; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-pane);
    z-index: 5; padding: 4px; transform: translateY(4px); opacity: 0; pointer-events: none;
    transition: opacity 0.12s, transform 0.12s; }
  #autocomplete.open { opacity: 1; transform: none; pointer-events: auto; }
  .ac-item { display: grid; grid-template-columns: 24px 110px 1fr auto; align-items: center;
    gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .ac-item.mention-item { grid-template-columns: 24px 1fr; }
  .ac-item:hover, .ac-item.selected { background: var(--accent-soft); }
  .ac-emoji { text-align: center; font-size: 14px; }
  .ac-cmd { font-weight: 700; color: var(--accent); }
  .ac-syntax { color: var(--fg-dim); font-size: 12px; }
  .ac-desc { color: var(--fg-dim); font-size: 11px; text-align: right; }

  /* Context menu */
  #ctxmenu { position: fixed; min-width: 180px; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-pane);
    padding: 4px; z-index: 100; opacity: 0; pointer-events: none;
    transform: translateY(-4px); transition: opacity 0.1s, transform 0.1s; }
  #ctxmenu.open { opacity: 1; transform: none; pointer-events: auto; }
  .ctx-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-radius: 4px; cursor: pointer; font-size: 13px; }
  .ctx-item:hover { background: var(--accent-soft); }
  .ctx-item.danger:hover { background: rgba(255,126,126,0.18); color: var(--error); }
  .ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* Whois modal */
  #whois-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  #whois-overlay.open { opacity: 1; pointer-events: auto; }
  #whois-modal { background: var(--bg-pane); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-pane); padding: 24px;
    min-width: 380px; max-width: 520px; max-height: 80vh; overflow-y: auto; }
  #whois-modal h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
  #whois-modal .whois-host { color: var(--fg-dim); font-size: 13px; margin-bottom: 16px; }
  #whois-modal .whois-row { display: grid; grid-template-columns: 110px 1fr;
    gap: 8px; padding: 4px 0; font-size: 13px; }
  #whois-modal .whois-row .label { color: var(--fg-dim); }
  #whois-modal .whois-row .value { word-break: break-word; }
  #whois-modal .whois-error { color: var(--error); font-style: italic; }
  #whois-modal .close-btn { float: right; margin-top: -4px; }
  #whois-modal .channel-chip { display: inline-block; padding: 1px 6px; margin: 2px;
    background: var(--bg-input); border-radius: 4px; font-size: 12px; }

  /* Channel/who list overlay (reuses whois-overlay pattern but bigger) */
  #list-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  #list-overlay.open { opacity: 1; pointer-events: auto; }
  #list-modal { background: var(--bg-pane); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-pane); padding: 16px;
    width: 90vw; max-width: 720px; height: 80vh; display: flex;
    flex-direction: column; gap: 10px; }
  #list-modal header { display: flex; align-items: center; gap: 10px; }
  #list-modal header h3 { margin: 0; flex: 1; font-size: 16px; }
  #list-modal input[type=search] { flex: 0 0 220px; padding: 6px 10px; font-size: 12px; }
  #list-modal .list-rows { flex: 1; overflow-y: auto; }
  #list-modal .list-row { padding: 6px 8px; border-radius: 4px; cursor: pointer;
    display: grid; grid-template-columns: 1fr 60px 2fr; gap: 10px; align-items: baseline;
    border-bottom: 1px solid var(--border); }
  #list-modal .list-row:hover { background: var(--accent-soft); }
  #list-modal .list-row .users { color: var(--fg-dim); font-size: 11px;
    font-variant-numeric: tabular-nums; text-align: right; }
  #list-modal .list-row .topic { color: var(--fg-dim); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list-modal.who .list-row { grid-template-columns: 1fr 1fr 1fr; }
  #list-modal .empty { color: var(--fg-dim); font-style: italic; padding: 20px;
    text-align: center; }

  /* Mobile sidebars (overlay) */
  #app .sidebar-toggle { display: none; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr !important; grid-template-areas:
      "userbar"
      "chat" !important; }
    #app .sidebar-toggle { display: inline-flex; }
    .resizer { display: none; }
    #channels, #members { position: fixed; top: 44px; bottom: 0; width: 80%;
      max-width: 320px; z-index: 50; transform: translateX(-100%);
      transition: transform 0.18s ease; box-shadow: 6px 0 24px rgba(0,0,0,0.4); }
    #channels { left: 0; }
    #members { right: 0; transform: translateX(100%); box-shadow: -6px 0 24px rgba(0,0,0,0.4); }
    #channels.open { transform: none; }
    #members.open { transform: none; }
    #userbar .desktop-only { display: none; }
  }
  @media (min-width: 761px) {
    #userbar .mobile-only { display: none; }
  }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
           aria-label="turborg" role="img">
        <!-- T crossbar + stem (overlap so it renders as a single solid glyph) -->
        <rect x="4" y="12" width="36" height="10" rx="2" fill="currentColor"/>
        <rect x="17" y="12" width="10" height="40" rx="2" fill="currentColor"/>
        <!-- Speed lines: three trailing dashes of decreasing weight to suggest motion. -->
        <rect x="44" y="18" width="16" height="5" rx="2.5" fill="currentColor" opacity="0.95"/>
        <rect x="48" y="29" width="12" height="5" rx="2.5" fill="currentColor" opacity="0.7"/>
        <rect x="46" y="40" width="14" height="5" rx="2.5" fill="currentColor" opacity="0.5"/>
      </svg>
      <h1>turborg</h1>
    </div>
    <p class="subtitle">real-time IRC, in the browser</p>
    <label for="token">access token</label>
    <input id="token" type="password" autocomplete="off" required />
    <div id="login-error"></div>
    <button type="submit" id="login-submit">Connect</button>
  </form>
</div>

<div id="app">
  <header id="userbar">
    <button class="icon mobile-only sidebar-toggle" id="toggleChannels"
      title="channels">☰</button>
    <svg class="brand-mark mini desktop-only" viewBox="0 0 64 64"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="4" y="12" width="36" height="10" rx="2" fill="currentColor"/>
      <rect x="17" y="12" width="10" height="40" rx="2" fill="currentColor"/>
      <rect x="44" y="18" width="16" height="5" rx="2.5" fill="currentColor" opacity="0.95"/>
      <rect x="48" y="29" width="12" height="5" rx="2.5" fill="currentColor" opacity="0.7"/>
      <rect x="46" y="40" width="14" height="5" rx="2.5" fill="currentColor" opacity="0.5"/>
    </svg>
    <span id="status-dot" title="connection status">●</span>
    <span id="current-nick" role="button" tabindex="0"
      title="click to change your IRC nick">—</span>
    <span class="status-text desktop-only" id="status-text">disconnected</span>
    <span id="userbar-spacer"></span>
    <button id="notifyToggle" class="icon" title="enable browser notifications">🔕</button>
    <button id="themeToggle" class="icon" title="toggle theme">🌓</button>
    <button class="icon mobile-only sidebar-toggle" id="toggleMembers"
      title="members">👥</button>
  </header>
  <aside id="channels"></aside>
  <div class="resizer" id="resizer-left" data-pane="left"></div>
  <main id="chat">
    <div id="topic"></div>
    <div id="messages"></div>
    <form id="compose" autocomplete="off">
      <div id="autocomplete"></div>
      <textarea id="input" autocomplete="off" rows="1"
        placeholder="message — type / for commands… (Shift+Enter newline)"
        disabled></textarea>
    </form>
  </main>
  <div class="resizer" id="resizer-right" data-pane="right"></div>
  <aside id="members"></aside>
</div>

<div id="ctxmenu"></div>

<div id="whois-overlay">
  <div id="whois-modal" role="dialog" aria-modal="true"></div>
</div>

<div id="list-overlay">
  <div id="list-modal" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
  "use strict";

  const SERVER_TAB = "*server*";

  const COMMANDS = [
    { name: "join",     syntax: "#channel",          desc: "join a channel",          emoji: "🚪" },
    { name: "part",     syntax: "[#channel]",        desc: "leave (default: current)",emoji: "👋" },
    { name: "cycle",    syntax: "[#channel]",        desc: "part + rejoin",           emoji: "♻️" },
    { name: "topic",    syntax: "[new topic]",       desc: "set/show channel topic",  emoji: "📌" },
    { name: "nick",     syntax: "<newnick>",         desc: "change nickname",         emoji: "👤" },
    { name: "msg",      syntax: "<nick> [message]",  desc: "open a query and send",   emoji: "💬" },
    { name: "query",    syntax: "<nick>",            desc: "open a query",            emoji: "💬" },

    { name: "ctcp",     syntax: "<target> <verb> [args]", desc: "send a CTCP request", emoji: "📡" },
    { name: "ignore",   syntax: "<nick>",            desc: "mute a user (client-side)",emoji: "🙉" },
    { name: "unignore", syntax: "<nick>",            desc: "unmute a user",           emoji: "👂" },
    { name: "ignores",  syntax: "",                  desc: "list ignored users",      emoji: "🙊" },
    { name: "notice",   syntax: "<target> <text>",   desc: "send a NOTICE",           emoji: "📣" },
    { name: "whois",    syntax: "<nick>",            desc: "look up a user",          emoji: "🔍" },
    { name: "list",     syntax: "[pattern]",         desc: "browse channels",         emoji: "📚" },
    { name: "who",      syntax: "<channel|mask>",    desc: "list users in target",    emoji: "👥" },

    { name: "away",     syntax: "[reason]",          desc: "mark yourself away",      emoji: "💤" },
    { name: "back",     syntax: "",                  desc: "clear away status",       emoji: "👋" },

    { name: "halfop",   syntax: "<nick>",            desc: "give halfop (+h)",        emoji: "🔼" },
