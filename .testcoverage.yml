# go-test-coverage (vladopajic/go-test-coverage) configuration.
# CI runs `go test -coverprofile=coverage.out ./internal/...` then
# `go-test-coverage --config .testcoverage.yml` to enforce these gates.
#
# Thresholds match the Python repo's `fail_under = 95` total bar. The
# IRC connector exemption mirrors Python's per-module reality at the
# same version: real-network error paths (TLS Dial, mid-handshake
# server drops) are unreachable from in-process tests without far more
# infrastructure than the value justifies.

profile: coverage.out

local-prefix: "github.com/turborg/turborg"

threshold:
  file: 70
  package: 80
  total: 90

override:
  - path: ^internal/agent$
    threshold: 95
  - path: ^internal/config$
    threshold: 90
  - path: ^internal/llm$
    threshold: 95
  - path: ^internal/llm/anthropic$
    threshold: 95
  - path: ^internal/logging$
    threshold: 100
  - path: ^internal/hive$
    threshold: 100
  - path: ^internal/connector/irc$
    threshold: 85
  - path: ^internal/web$
    threshold: 80
  - path: ^internal/runtime$
    threshold: 65

# cmd/turborg + internal/version + tests/fixtures contain only thin
# wiring or test infrastructure. CI excludes them from the package
# pattern by running `go test ./internal/...`, not `./...`.
exclude-paths:
  - ^cmd/
  - ^tests/
  - ^internal/version$
